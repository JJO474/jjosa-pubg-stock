<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JJOSA STOCK OBS</title><style>body{background:transparent;color:white;font-family:system-ui,'Malgun Gothic',sans-serif;margin:0}#bar{background:rgba(8,15,26,.92);border:1px solid #40516a;border-radius:12px;display:flex;align-items:center;gap:30px;padding:17px 24px;white-space:nowrap;overflow:hidden}b{color:#f1bf53}#items{display:flex;gap:32px}.up{color:#48dca2}.down{color:#ff7082}</style><div id="bar"><b>JJOSA STOCK</b><div id="items">등록된 종목을 기다리는 중...</div></div><script>async function load(){try{const d=await(await fetch('/api/state')).json();const changes=Object.fromEntries(d.players.map(p=>[p.id,d.ticks.find(t=>t.player===p.id)?.change_pct||0]));document.querySelector('#items').textContent='';for(const p of d.players){const s=document.createElement('span'),v=changes[p.id];s.textContent=`${p.name} ${p.price.toLocaleString()} P `;const c=document.createElement('strong');c.className=v>=0?'up':'down';c.textContent=`${v>=0?'▲':'▼'} ${Math.abs(v).toFixed(2)}%`;s.append(c);document.querySelector('#items').append(s)}if(!d.players.length)document.querySelector('#items').textContent='등록된 종목을 기다리는 중...'}catch(e){}}load();setInterval(load,15000)</script></html>
