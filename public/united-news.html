<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNITED 증권 뉴스 수집 센터</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#191f28;font-family:Arial,"Noto Sans KR",sans-serif}.wrap{max-width:1180px;margin:auto;padding:34px 22px 70px}header{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:24px}h1{margin:5px 0;font-size:30px}.muted{color:#8b95a1}.badge{padding:8px 12px;border-radius:999px;background:#e8f3ff;color:#1b64da;font-weight:700}.grid{display:grid;grid-template-columns:280px 1fr;gap:16px}.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 1px 3px #0000000d}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#f8f9fa;border-radius:14px;padding:13px}.stat b{display:block;font-size:23px;margin-top:4px}.filters button{width:100%;text-align:left;margin:5px 0;border:0;border-radius:12px;padding:11px 12px;background:#f2f4f6;cursor:pointer;font-weight:700}.filters button.active{background:#3182f6;color:#fff}.news{padding:17px 4px;border-bottom:1px solid #eef0f2}.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.type{font-size:12px;font-weight:800;padding:5px 8px;border-radius:999px}.official{background:#e8f3ff;color:#1b64da}.market{background:#e8faf0;color:#008a52}.rumor{background:#fff3e0;color:#b35c00}.news h2{font-size:18px;margin:10px 0 7px}.news p{margin:0;color:#4e5968;line-height:1.55}.meta{font-size:12px;color:#8b95a1;margin-top:10px}.tags{margin-top:9px}.tags span{font-size:11px;background:#f2f4f6;padding:4px 7px;border-radius:7px;margin-right:5px}.link{display:inline-block;margin-top:11px;color:#3182f6;text-decoration:none;font-weight:700;font-size:13px}.warn{background:#fff8e7;border-radius:14px;padding:13px;font-size:12px;color:#805500;margin-top:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap">
<header><div><div class="muted">PUBG UNITED 2026 · READ-ONLY PREVIEW</div><h1>UNITED 증권 뉴스 수집 센터</h1><div class="muted">공식 뉴스 · 시장 브리핑 · 커뮤니티형 가상 시나리오를 출처별로 검증</div></div><span class="badge" id="status">불러오는 중</span></header>
<div class="grid"><aside class="card"><h3>수집 현황</h3><div class="stats"><div class="stat">전체<b id="all">-</b></div><div class="stat">공식<b id="official">-</b></div><div class="stat">시장<b id="market">-</b></div><div class="stat">루머<b id="rumor">-</b></div></div><h3>필터</h3><div class="filters"><button class="active" onclick="setFilter('all',this)">전체 피드</button><button onclick="setFilter('official',this)">공식 뉴스</button><button onclick="setFilter('market',this)">시장 브리핑</button><button onclick="setFilter('rumor',this)">시장루머 · 가상</button></div><div class="warn">시장루머/커뮤니티 글은 실제 사실이 아닌 가상 시나리오로 명확하게 표시합니다. 현재 기존 쪼사증권 D1 피드에는 저장하지 않습니다.</div><p class="muted" style="font-size:12px">공식 출처: PUBG ESPORTS / PUBG.com<br>경기 속보: Tournament API 연동 예정<br>주가 속보: UNITED 증권 거래소 구축 후 연동</p></aside><main class="card"><div id="feed"></div></main></div></div>
<script>let items=[],filter='all';const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function label(k){return k==='official'?'공식':k==='market'?'시장':'시장루머 · 가상'}
function render(){const a=filter==='all'?items:items.filter(x=>x.kind===filter);$('feed').innerHTML=a.map(x=>'<article class="news"><div class="top"><span class="type '+x.kind+'">'+label(x.kind)+'</span><span class="muted" style="font-size:12px">'+esc(x.source)+'</span></div><h2>'+esc(x.title)+'</h2><p>'+esc(x.summary)+'</p><div class="tags">'+(x.tags||[]).map(t=>'<span>#'+esc(t)+'</span>').join('')+'</div><div class="meta">'+new Date(x.published_at).toLocaleString('ko-KR')+(x.verified?' · 검증 출처':'')+'</div>'+(x.url?'<a class="link" href="'+esc(x.url)+'" target="_blank" rel="noopener">원문 보기 ↗</a>':'')+'</article>').join('')||'<p class="muted">항목이 없습니다.</p>'}
function setFilter(k,b){filter=k;document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
async function init(){try{const r=await fetch('/api/united/news-center'),j=await r.json();if(!r.ok)throw Error(j.error||r.status);items=j.items||[];for(const k of ['all','official','market','rumor'])$(k).textContent=j.counts[k];$('status').textContent='수집 정상';render()}catch(e){$('status').textContent='확인 필요';$('feed').innerHTML='<p>'+esc(e.message)+'</p>'}}init();</script></body></html>
